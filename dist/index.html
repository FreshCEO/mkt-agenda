  --blue:#3c6399; --blue-bg:#eef3fa; --blue-line:#bccde6; --red:#b5473c; --red-bg:#fbeeea; --red-line:#ebc0b8; --ok:#3f7a57; --ok-bg:#ecf4ee; --ok-line:#bcd9c5;
  --cvo:#4a3f33; --kpi:#d9954a; --core:#d4b04a; --hr:#bd7a62;
  --r:14px;
  --ff:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
  --fh:"Gmarket Sans","Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#e8c57e}
body{min-height:100vh;color:var(--text);font-family:var(--ff);font-size:15.5px;font-weight:450;line-height:1.6;
  background:radial-gradient(ellipse 125% 95% at 50% 28%,#fdf0c8 0%,#f7dfa2 34%,#eccb86 70%,#dcb46a 100%) fixed;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pepper);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 90px}
.sheet{position:relative;background:var(--ivory);border-radius:24px;padding:30px 32px 36px;box-shadow:0 34px 60px -22px rgba(120,84,20,.35)}
.sheet::after{content:"";position:absolute;left:12%;right:12%;bottom:-34px;height:26px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(120,84,20,.22),transparent 70%);pointer-events:none}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:rgba(104,84,58,.96);backdrop-filter:blur(8px);border-bottom:3px solid var(--gold)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--fh);font-weight:700;font-size:21px;letter-spacing:.01em;margin-right:4px;color:#fffaeb;line-height:1.25}
.brand em{font-style:normal;color:#f6dc94}
.brand small{display:block;font-family:var(--ff);font-weight:500;font-size:12.5px;color:#f1e3c0;letter-spacing:0}
.tabs{display:flex;gap:4px;background:rgba(40,28,10,.28);border-radius:999px;padding:5px;flex-wrap:wrap}
.tab{font-family:var(--fh);border:0;background:transparent;padding:9px 16px 7px;border-radius:999px;color:#fbf0d6;font-weight:500;font-size:15px}
.tab:hover{color:#fff}
.tab[aria-selected=true]{background:#f6dc94;color:var(--brown);font-weight:700}
.tab .cnt{margin-left:6px;font-family:var(--ff);font-size:12.5px;font-weight:700;color:#fbeac0;font-variant-numeric:tabular-nums}
.tab[aria-selected=true] .cnt{color:var(--red)}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13.5px;color:#fbf0d6;font-weight:600}
.who .btn{background:transparent;color:#fffaeb;border-color:rgba(255,244,214,.6)}
.who .btn:hover{border-color:#fffaeb}
select,.inp,textarea{background:#fff;border:1.5px solid var(--line2);border-radius:10px;padding:8px 11px;color:var(--text);font-weight:500}
select:hover,.inp:hover,textarea:hover{border-color:#b09a62}
textarea{width:100%;resize:vertical;min-height:66px;line-height:1.55}
.inp{width:100%}
::placeholder{color:var(--faint);font-weight:400}

/* 주간 흐름 */
.flow{margin:22px 0 26px}
.flow-h{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px;color:var(--brown)}
.flow-h b{font-family:var(--fh);font-size:22px;font-weight:700;letter-spacing:.01em}
.flow-h span{font-size:14.5px;font-weight:600;color:var(--brown)}
.nodes{display:flex;align-items:stretch;overflow-x:auto;padding:4px 2px 12px}
.node{position:relative;flex:1 0 118px;min-width:118px;text-align:left;background:var(--ivory);border:0;border-radius:999px;padding:10px 12px 9px 17px;margin-right:16px;box-shadow:0 8px 16px -6px rgba(120,84,20,.3)}
.node:last-child{margin-right:0}
.node::after{content:"";position:absolute;left:100%;top:50%;width:16px;height:3px;background:rgba(150,116,48,.5)}
.node:last-child::after{display:none}
.node .t{font-size:12.5px;font-weight:700;color:var(--gilt);font-variant-numeric:tabular-nums}
.node .n{font-family:var(--fh);font-weight:700;font-size:14px;line-height:1.35;margin-top:2px;color:var(--text);white-space:nowrap}
.node.done{background:linear-gradient(90deg,#f3dc9a 0 50%,var(--ivory) 50% 100%)}
.node.done .t{color:#5a4310}
.node.done::after{background:#b3923f}
.node.now{background:var(--pepper);box-shadow:0 0 0 3px #f6dc94,0 10px 18px -6px rgba(70,50,20,.35)}
.node.now .t{color:#f6dc94}
.node.now .n{color:#fffaeb}
.node:not(.done):not(.now):hover{background:#fff}
.flow-f{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:14px;font-weight:500;color:var(--brown);flex-wrap:wrap}
.flow-f b{font-weight:800}
.flow-f .btn{background:var(--ivory);border-color:transparent;box-shadow:0 4px 10px -4px rgba(120,84,20,.32)}
.clock{display:inline-flex;align-items:center;background:var(--pepper);color:#fffaeb;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600}

/* 공통 */
.btn{font-family:var(--fh);border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:9px 16px 7px;font-weight:500;font-size:14.5px;color:var(--text)}
.btn:hover{border-color:#b09a62}
.btn.pri{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:700}
.btn.pri:hover{background:#8f5412;border-color:#8f5412}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.btn.dark{background:var(--pepper);color:#fffaeb;border-color:var(--pepper)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px 4px;font-size:13.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h2{font-family:var(--fh);font-size:27px;letter-spacing:.005em;margin:0;font-weight:700;color:var(--brown);padding-bottom:5px;border-bottom:5px solid var(--gold);line-height:1.3}
h3{font-family:var(--fh);font-size:17px;margin:0;font-weight:700;color:var(--text)}
.lead{font-size:15.5px;color:var(--mute);margin:10px 0 14px;max-width:78ch;font-weight:500}
.mute{color:var(--mute)} .small{font-size:13.5px}
.card{background:var(--ivory2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--mute)}
.pill b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
button.pill:hover{color:var(--text);border-color:#b09a62}
.pill.on{background:var(--pepper);color:#fffaeb;border-color:var(--pepper)}
.pill.on b{color:#f6dc94}
button.pill.on:hover{color:#fffaeb;border-color:var(--pepper)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid var(--line2);color:var(--mute);white-space:nowrap;background:#fff}
.tag.t-이슈{color:#fff;border-color:var(--red);background:var(--red)}
.tag.t-의사결정{color:var(--brown);border-color:#e3c46e;background:#f8e3a3}
.tag.t-자문{color:#fff;border-color:#6b5f52;background:#6b5f52}
.tag.t-new{color:#fff;border-color:var(--ok);background:var(--ok)}
.tag.t-same{color:var(--mute);border-style:dashed;background:transparent}
.tag.demo{color:var(--mute);border-style:dashed;background:transparent;font-weight:600}
.tag.t-re{color:#fff;border-color:var(--blue);background:var(--blue)}
.note{border:1.5px dashed var(--line2);border-radius:10px;padding:10px 13px;color:var(--mute);font-size:13.5px;font-weight:500}
.note.warn{border-color:#e3c46e;color:#5e4a12;background:#fdf5dc}

/* 미제출 띠 */
.miss{border:1.5px solid var(--red-line);border-left:8px solid var(--red);background:var(--red-bg);border-radius:var(--r);padding:16px 18px;margin:16px 0}
.miss.ok{border-color:var(--ok-line);border-left-color:var(--ok);background:var(--ok-bg)}
.miss h3{color:var(--red);font-size:19px;display:flex;align-items:center;gap:10px}
.miss h3 i{font-style:normal;background:var(--red);color:#fff;border-radius:999px;min-width:30px;height:30px;display:inline-grid;place-items:center;font-size:16px;padding:2px 9px 0}
.miss.ok h3{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{background:#fff;border:1.5px solid var(--red-line);border-radius:999px;padding:5px 13px;font-size:14.5px;font-weight:700}
.chip i{font-style:normal;color:var(--mute);margin-left:7px;font-size:13px;font-weight:500}
.chip b{color:var(--red);font-weight:800;margin-left:7px;font-size:13px}

/* 누적 표 */
table.cum{width:100%;border-collapse:collapse;font-size:14px}
.cum th,.cum td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.cum th{color:var(--mute);font-weight:700}
.cum td:first-child{font-weight:700}
.cum td.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mute)}
.cum td.num.hot{color:var(--red);font-weight:800}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid var(--line2)}
.dots i.full{background:var(--core);border-color:var(--core)}
.dots i.partial{background:linear-gradient(90deg,var(--core) 50%,transparent 50%);border-color:var(--core)}
.dots i.none{border-color:var(--red);background:var(--red-bg)}
.dots i.na{border-style:dotted;opacity:.5}

/* 안건 */
.cat{margin-top:30px}
.cat-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:9px 14px 7px;border-radius:10px;background:var(--pepper)}
.cat-h h3{font-size:18px;color:#fffaeb}
.cat-h .n{font-family:var(--fh);font-weight:700;font-size:14px;color:var(--brown);background:#f6dc94;border-radius:999px;padding:3px 10px 1px}
.port{width:12px;height:12px;border-radius:50%;flex:none}
.p-cvo{background:#fffaeb} .p-kpi{background:var(--kpi)} .p-core{background:#f8e3a3} .p-hr{background:#e8a892} .p-fb{background:#a9c4ee}
.in-cat .p-cvo{background:var(--cvo)} .in-cat .p-core{background:var(--core)} .in-cat .p-hr{background:var(--hr)}
.hg .p-cvo{background:var(--cvo)} .hg .p-core{background:var(--core)} .hg .p-hr{background:var(--hr)}
.sub{font-family:var(--fh);font-size:14.5px;color:var(--gilt);margin:16px 0 7px 2px;font-weight:700}
.item{position:relative;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--c,var(--line2));border-radius:12px;padding:14px 16px;margin-bottom:9px}
.item.off{opacity:.45}
.item-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-h b{font-family:var(--fh);font-size:17px;font-weight:700;line-height:1.35}
.item-h .by{color:var(--mute);font-size:14px;font-weight:600}
.body{white-space:pre-wrap;margin-top:8px;color:#2f2922;font-size:15.5px;line-height:1.7;max-width:88ch;font-weight:450}
.body.raw{color:var(--mute);border-left:3px solid var(--line2);padding-left:11px;margin-top:9px;font-size:14.5px}
.lk{border:0;background:none;color:var(--orange);padding:0;font-size:13.5px;margin-top:7px;font-weight:700}
.lk:hover{text-decoration:underline}
.edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1.5px dashed var(--line)}
.edit label{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--mute);font-weight:600}
.edit .inp{flex:1;min-width:220px;padding:6px 10px;font-size:13.5px}
.dupe{margin-top:9px;padding:9px 11px;border-radius:9px;background:var(--ivory2);font-size:13.5px}
input[type=checkbox]{accent-color:var(--orange);width:16px;height:16px}

/* 피드백 */
.fb{border:1.5px solid var(--blue-line);border-left:6px solid var(--blue);background:var(--blue-bg);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.fb-when{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.fb-when b{font-family:var(--fh);color:var(--blue);font-size:16.5px;font-weight:700}
.fb-when .age{font-size:13px;color:#fff;background:var(--blue);border-radius:999px;padding:2px 10px;font-weight:700}
.fb-t{margin-top:7px;font-size:15.5px;color:#1f3557;max-width:80ch;font-weight:600}
.fb .meta{font-size:13.5px;color:#4a678f;margin-top:4px;font-weight:600}
.fb textarea{border-color:var(--blue-line);margin-top:6px}
.lab{display:block;margin-top:9px;color:var(--blue);font-size:13.5px;font-weight:700}
.fb.draft{border-style:dashed;border-left-style:solid;background:#f5f7fb}
.fb.done{opacity:.55}
.act{font-size:13.5px;color:#34507a;margin-top:7px;padding-left:11px;border-left:3px solid var(--blue-line);white-space:pre-wrap;font-weight:500}
.act.miss-r{color:var(--red);border-color:var(--red);font-weight:700}
.fbin{border:1.5px solid var(--blue-line);border-left:6px solid var(--blue);background:var(--blue-bg);border-radius:10px;padding:12px 14px;margin-top:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:start}
.form label{display:block;font-size:13.5px;color:var(--mute);margin:11px 0 4px;font-weight:700}
.form .r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.form .r2 > div{min-width:0}
.card,.grid2 > *,.mail > *{min-width:0}
input.inp,select.inp{min-width:0}
.fbform{display:grid;gap:8px;margin-top:8px}
.fbform .r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fbform textarea{margin-top:0}
.filebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line2);border-radius:10px;padding:10px 12px;background:#fff;margin-top:6px}

/* 입력 */
.in-cat{background:var(--ivory2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px}
.draft{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-top:11px}
.draft .r3{display:grid;grid-template-columns:150px 1fr 150px auto;gap:8px}
.draft .r3 [data-in=title]{font-weight:700}
.draft .f{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin-top:8px}
.draft .f span{font-size:13.5px;color:var(--mute);font-weight:700}
.cnt2{font-style:normal;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:48px;text-align:right;font-weight:600}
.cnt2.over{color:var(--red);font-weight:800}
.state{font-family:var(--fh);font-size:14px;font-weight:700;border-radius:999px;padding:6px 13px 4px;border:1.5px solid var(--line2)}
.state.ok{color:#fff;border-color:var(--ok);background:var(--ok)}
.state.late{color:var(--brown);border-color:#e3c46e;background:#f8e3a3}
.state.no{color:#fff;border-color:var(--red);background:var(--red)}
.err{color:var(--red);font-size:14px;font-weight:700}
.carried{color:#5e4a12;background:#fdf5dc;border-radius:8px;padding:5px 10px;font-size:13.5px;margin-top:8px;font-weight:600;display:inline-block}

/* 히스토리 */
.hist{display:grid;grid-template-columns:160px minmax(0,1fr);gap:18px}
.wk{display:flex;flex-direction:column;gap:4px}
.wk button{font-family:var(--fh);text-align:left;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:8px 11px 6px;color:var(--mute);font-weight:500;font-size:15px}
.wk button:hover{color:var(--text)}
.wk button.on{background:var(--pepper);color:#fffaeb;font-weight:700}
.wk small{display:block;font-family:var(--ff);font-size:12.5px;color:var(--faint);font-weight:500}
.wk button.on small{color:#f6dc94}
table.hg{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:14px}
.hg th,.hg td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top;text-align:left}
.hg th{position:sticky;top:66px;background:var(--ivory);color:var(--text);font-weight:800;z-index:2;border-bottom:2px solid var(--pepper)}
.hg td.tm{width:112px;font-weight:800;color:var(--text)}
.hg td{color:#352f27}
.hg .cell{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.hg .cell.open{display:block}
.hg .none{color:var(--faint)} .hg .blank{color:var(--red);font-weight:700}
mark{background:#f8e3a3;color:inherit;border-radius:3px;padding:0 2px;font-weight:700}
.hit{border-left:4px solid var(--gold);padding:2px 0 2px 13px;margin:12px 0}
.hit .w{font-size:13.5px;color:var(--mute);font-weight:600}
.hit .w b{font-family:var(--fh);color:var(--text)}
.hit .l{white-space:pre-wrap;font-size:14.5px}

/* 메일 */
.mail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.mail textarea{min-height:420px;font-size:14.5px;line-height:1.6}
table.st{width:100%;border-collapse:collapse;font-size:14px}
.st th,.st td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.st th{color:var(--mute);font-weight:700}
.st td:first-child{font-weight:700}
.log{max-height:280px;overflow:auto;font-size:13.5px}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.log span{color:var(--mute);margin-right:8px;font-variant-numeric:tabular-nums;font-weight:600}

.btn.submit{background:#156b39;border-color:#156b39;color:#fff;font-size:18px;font-weight:800;padding:13px 38px;border-radius:999px;box-shadow:0 4px 12px rgba(21,107,57,.3)}
.btn.submit:hover{background:#0f5a2f;border-color:#0f5a2f}
.btn.submit.sm-top{font-size:15px;padding:8px 22px}
.sync{display:inline-flex;align-items:center;gap:2px;background:#fffaeb;color:#3a2f14;border:1px solid #d9c08a;border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.sync.float{position:fixed;right:14px;bottom:14px;z-index:40;box-shadow:0 4px 14px rgba(70,50,20,.18)}
.sync-slot{display:inline-flex}
.leadbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fffaeb;border:1px solid #e3cf9e;border-radius:14px;padding:10px 14px;margin:14px 0 4px;font-size:15px}
.leadbar .sp{flex:1}
.lost{background:#fff1ec;border:1px solid #e9a58f;border-radius:12px;padding:10px 12px;margin:10px 0}
.lost textarea{width:100%;min-height:90px;margin-top:6px;font-size:13px}
.sync span{margin-left:6px;padding:1px 8px;border-radius:999px;background:#f1e2b8;font-size:12px}
.sync.fail,.sync.boot{background:#ffe6e1;border-color:#d77}
.sync button{margin-left:6px;border:1px solid #c66;background:#fff;border-radius:999px;padding:1px 10px;cursor:pointer;font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--pepper);color:#fffaeb;border-radius:999px;padding:11px 22px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(70,50,20,.35);max-width:90vw;font-size:15px}

/* 한 장 보기 */
.paper-bg{position:fixed;inset:0;background:rgba(70,54,30,.62);z-index:40;overflow:auto;padding:24px}
.paper{background:#fff;color:#16161a;max-width:820px;margin:0 auto;border-radius:6px;padding:34px 40px}
.paper h1{font-family:var(--fh);font-size:22px;margin:0 0 2px;font-weight:700}
.paper h4{font-family:var(--fh);font-size:15px;margin:18px 0 6px;border-bottom:2px solid #16161a;padding-bottom:3px}
.paper .pi{margin:9px 0;font-size:13.5px;line-height:1.55}
.paper .pi b{font-size:14.5px}
.paper .pi div{white-space:pre-wrap;color:#2c2c34}
.paper .memo{color:var(--blue);font-weight:700}
.paper .bar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px}

@media (max-width:860px){
  .grid2,.hist,.mail{grid-template-columns:1fr}
  .wk{flex-direction:row;flex-wrap:wrap}

function srvSplit(st){
  const out = {}, core = {}, a = st.active, act = Object.assign({}, a);
  Object.keys(st).forEach(k => { if (!LOCAL.includes(k)) core[k] = st[k]; });
  act.items = []; TEAM_F.forEach(f => act[f] = {});
  const names = new Set(st.teams.map(t => t.name));
  a.items.forEach(i => names.add(i.team)); TEAM_F.forEach(f => Object.keys(a[f] || {}).forEach(n => names.add(n)));
  names.forEach(n => { const s = {items:a.items.filter(i => i.team === n)}; TEAM_F.forEach(f => { if ((a[f] || {})[n] !== undefined) s[f] = a[f][n]; }); out['team:' + n] = JSON.stringify(s); });

}
function srvJoin(m){
  const core = JSON.parse(m.core), a = core.active; a.items = []; TEAM_F.forEach(f => a[f] = {});
  Object.keys(m).filter(k => k.indexOf('team:') === 0).forEach(k => { const n = k.slice(5), s = JSON.parse(m[k]); a.items.push(...(s.items || [])); TEAM_F.forEach(f => { if (s[f] !== undefined) a[f][n] = s[f]; }); });

}

async function srvCall(op, args){

  if (!r.ok) throw new Error('서버 응답 ' + r.status);

function srvLog(list){ S.log = R.logs.map(x => x.e).reverse().concat(list || []); }
/* keys 조각은 서버 내용으로, 나머지는 지금 화면 내용으로 합친다 */
function srvApply(keys){

  Object.keys(R.last).forEach(k => { if (keys.includes(k) || !(k in cur)) m[k] = R.last[k]; });

async function srvPush(){

  /* 지우기는 내가 마지막으로 본 버전과 서버 버전이 같을 때만 서버가 지운다 (그사이 누가 저장했으면 남긴다) */
  const drop = R.role === 'admin' ? Object.keys(R.last).filter(k => k.indexOf('team:') === 0 && !(k in cur)).map(k => ({k, ver:R.ver[k] || 0})) : [];
  if (!keys.length && !logs.length && !drop.length){ if (R.state === 'fail') srvState('saved'); if (R.afterSave){ toast(R.afterSave + ' ' + (R.at || '')); R.afterSave = null; } return; }

    keys.forEach(k => { if (d.vers[k] != null){ R.ver[k] = d.vers[k]; R.last[k] = cur[k]; } });
    (d.dropped || []).forEach(k => { delete R.ver[k]; delete R.last[k]; });
    const cf = d.conflicts || [], gone = cf.filter(c => !c.json).map(c => c.k), names = S.teams.map(t => t.name);
    if (cf.length){
      /* 덮어쓰기 전에 내 입력을 보관해 두고 화면에 보여 준다 */
      cf.forEach(c => { if (c.k.indexOf('team:') === 0 && cur[c.k]){ try{ const its = JSON.parse(cur[c.k]).items || []; if (its.length) (S.ui.lost = S.ui.lost || {})[c.k.slice(5)] = {at:stampNow(), text:its.map(i => '[' + (i.title || '') + ']\n' + [compose(i), i.detail].filter(Boolean).join('\n')).join('\n\n')}; }catch(e){} } });
      cf.forEach(c => { if (c.json){ R.ver[c.k] = c.ver; R.last[c.k] = c.json; } else { delete R.ver[c.k]; delete R.last[c.k]; } });
      /* 서버에서 지워진 팀: 팀 목록에 없으면 화면에서도 뺀다 (있으면 다음 저장 때 새로 만든다) */

      srvApply(cf.filter(c => c.json).map(c => c.k));
    }
    srvLog(d.log); R.at = stampNow(); R.busy = false; srvState('saved');
    if (cf.length){ render(); toast('다른 사람이 먼저 고친 내용이 있어 최신 내용으로 바꿨습니다. 내가 쓴 내용은 입력 칸 위에 보관해 두었습니다.'); }
    else if (after) toast(after + ' ' + R.at);
  }catch(e){ R.logs.unshift(...logs); R.busy = false; R.err = e.message; srvState('fail'); if (after){ S.ui.err = '제출을 서버에 저장하지 못했습니다. 위쪽 [다시 저장]을 눌러 주세요.'; render(); toast('저장하지 못했습니다. [다시 저장]을 눌러 주세요.'); } }

}
async function srvPoll(){

function mk(t, c, o){ return Object.assign({id:uid(), team:t, cat:c, sub:cat(c).subs[0], title:'', type:'보고', now:'', cause:'', plan:'', detail:''}, o || {}); }
function compose(it){
  const a = [];

function firstLine(s){ const l = (s.split('\n').find(x => x.trim()) || '').replace(/^[\s*\-\[\]①②③■]+/, '').replace(/\]$/, ''); return l.length > 34 ? l.slice(0,34) + '…' : l; }
function excerpt(text){
  const ls = text.split('\n').map(x => x.trim()).filter(Boolean);
  const sc = l => (/\d/.test(l) ? 2 : 0) + (/(목표|예측|GAP|지연|필요|예정|완료|자문|승인|계약|이슈)/.test(l) ? 1 : 0);
  const pick = ls.map((l,i) => ({l,i,s:sc(l)})).sort((a,b) => b.s - a.s || a.i - b.i).slice(0,3).sort((a,b) => a.i - b.i);

/* 지난 주에 쓴 내용을 이번 주 입력 칸에 그대로 넣는다 */
function prefill(a, prev, only){

  S.teams.forEach(t => {
    const nm = t.name; if (only && nm !== only) return;

      prev.items.filter(i => i.team === nm).forEach(i => { const c = cat(i.cat); if (!c) return;
        const rawKnown = i.raw !== undefined;
        a.items.push(mk(nm, i.cat, {sub:c.subs.includes(i.sub) ? i.sub : c.subs[0], title:i.title, type:i.type, now:rawKnown ? (i.now || '') : '', cause:rawKnown ? (i.cause || '') : '', plan:rawKnown ? (i.plan || '') : '', detail:rawKnown ? (i.raw || '') : (i.text || ''), carried:true, from:prev.label})); n++; });
    } else S.cats.forEach(c => { const v = cells[c.id] || ''; if (v && v !== '없음' && !v.startsWith('〔')){ a.items.push(mk(nm, c.id, {title:firstLine(v), detail:v, carried:true, from:prev.label})); n++; } });

function cum(name){
  const ref = dt(S.active.meeting), q = Math.floor(ref.getMonth()/3);

  const count = (meeting, miss) => { if (!miss) return; const d = dt(meeting); if (d.getFullYear() !== ref.getFullYear()) return; if (Math.floor(d.getMonth()/3) === q) qq++; if (d.getMonth() === ref.getMonth()) m++; };

/* 팀장 입력에 따라붙는 피드백: 다음주 재보고(once) 또는 연속관리(keep). 이번 주 미팅에서 막 나온 피드백은 다음 주차 몫이다 */
const reFb = () => S.fb.filter(f => f.status === 'open' && f.mode && f.date < S.active.meeting);
const fbMeeting = () => S.active.stage >= 6 ? S.active.meeting : addDays(S.active.meeting, -7);
const fbDue = () => addDays(fbMeeting(), 4);
const fbTarget = f => f.date < S.active.meeting ? S.active.label : weekLabel(addDays(S.active.meeting, 7));
const modeName = m => m === 'keep' ? '연속관리' : m === 'once' ? '다음주 재보고' : '';
function fbAge(f){ return Math.max(1, Math.round((dt(S.active.meeting) - dt(f.date)) / 6048e5)); }
function prevWeek(label){ if (label === S.active.label) return S.weeks[0]; const i = S.weeks.findIndex(w => w.label === label); return i >= 0 ? S.weeks[i+1] : null; }
function isNew(it, label){
  const p = prevWeek(label); if (!p) return false;
  if (label === S.active.label){ const src = S.active.items.find(x => x.id === it.id); if (src) return !src.from && !src.auto; }
  const cells = p.cells[it.team]; if (!cells) return true;
  if ((cells[it.cat] || '').startsWith('〔')) return false;
  const key = (it.title || '').replace(/[\[\]()↔,]/g, ' ').split(/\s+/).find(w => w.length >= 2 && !/^\d/.test(w));
  if (!key) return false;
  return !Object.values(cells).some(v => (v || '').includes(key));
}

/* ---------- 실제 시계 따라가기 ---------- */
function realStage(meeting){
  const M = dt(meeting), at = (off, h) => { const d = new Date(M); d.setDate(d.getDate() + off); d.setHours(h, 0, 0, 0); return d; };
  const T = STAGES.map((_, i) => { const x = stAt(i), d = at(x.o, +x.h.slice(0,2)); d.setMinutes(+x.h.slice(3,5) || 0); return d; }), now = nowD();
  let s = 0; T.forEach((x,i) => { if (now >= x) s = i; });
  return {s, next: now >= at(1,9)};
}
function tick(){
  if (S.set.clock !== 'real') return false;
  /* 서버 모드에서 시점을 넘기고 새 주차를 여는 것은 관리 화면(발송기 포함)만 한다. 팀장 화면이 하면 팀 조각이 새 주차로 덮인다 */
  if (R.on && R.role !== 'admin') return false;
  let ch = false, guard = 0;
  while (guard++ < 60){
    const r = realStage(S.active.meeting);
    if (r.next){ if (S.active.stage < LAST) advance(LAST); rollover(); ch = true; continue; }
    if (r.s > S.active.stage){ advance(r.s); ch = true; }
    break;
  }
  return ch;
}

/* 녹취록에서 팀, 안건 이름과 지시 표현이 함께 나온 문장을 찾는다 (규칙 기반) */
function dueOf(s, base){
  const b = dt(base); let m;
  if ((m = s.match(/(\d{1,2})\s?[\/월]\s?(\d{1,2})일?/)) && +m[1] >= 1 && +m[1] <= 12 && +m[2] >= 1 && +m[2] <= 31){ const d = new Date(b.getFullYear(), +m[1]-1, +m[2]); if (d < b) d.setFullYear(d.getFullYear()+1); return iso(d); }
  if ((m = s.match(/(\d{1,2})일\s?까지/)) && +m[1] >= 1 && +m[1] <= 31){ const d = new Date(b.getFullYear(), b.getMonth(), +m[1]); if (d < b) d.setMonth(d.getMonth()+1); return iso(d); }
  if (/월말/.test(s)) return iso(new Date(b.getFullYear(), b.getMonth()+1, 0));
  if ((m = s.match(/([월화수목금])요일/))){ const k = DOW.indexOf(m[1]), d = new Date(b); do { d.setDate(d.getDate()+1); } while (d.getDay() !== k); return iso(d); }
  return addDays(base, 4);
}
function scanTr(text){
  const dict = [], seen = {};
  const put = (k, t, r, min) => { if (k && k.length >= min && !/^\d/.test(k) && !seen[k]){ seen[k] = 1; dict.push([k, t, r]); } };
  (S.weeks[0].items || []).concat(S.active.items).forEach(i => put((i.title || '').split(/[\s(,]/)[0], i.team, i.title, 3));
  S.fb.forEach(f => put((f.ref || '').split(/[\s(,]/)[0], f.team, f.ref, 3));
  S.teams.forEach(t => { put(t.name, t.name, '', 2); put(t.name.replace(/팀$/, ''), t.name, '', 2); });
  dict.sort((a,b) => b[0].length - a[0].length);
  const AC = /(해\s?주|하세요|하십시오|하도록|바랍니다|바람|보고해|보고하|보고 바|정리해|정리하|챙겨|챙기|준비해|준비하|제출|마무리|확정하|진행하|진행해|가져오|검토해|검토하|만들어|끝내|봅시다|까지)/, CK = /(확인|점검|체크|파악)/, TL = /(공유|전달|안내|참고)/, KP = /(매주|매 주|주 단위|주간 단위|계속|지속적|매번|될 때까지|날 때까지)/;
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim())
    .filter(l => l && !/^\d+$/.test(l) && !/-->/.test(l) && !/^WEBVTT/i.test(l) && !/^(참석자|화자|발화자|Speaker)\s?\d*\s*\d{1,2}:\d{2}(:\d{2})?$/i.test(l))
    .map(l => l.replace(/^[\[(]?\d{1,2}:\d{2}(:\d{2})?[\])]?\s*/, '').replace(/^(참석자|화자|발화자|Speaker)\s?\d+\s*(\d{1,2}:\d{2}(:\d{2})?)?\s*[:：]?\s*/i, '').replace(/^[가-힣]{2,4}\s?(본부장|사업부장|팀장|상무|전무|이사|님)?\s*[:：]\s+/, ''));
  const groups = []; let n = 0;
  lines.forEach(line => {
    let cur = null, gap = 9;
    line.split(/(?<=[.?!])\s+/).map(s => s.trim()).filter(s => s.length > 5).forEach(s => {
      n++;
      const hit = dict.find(([k]) => s.includes(k)), act = AC.test(s) || CK.test(s) || TL.test(s);
      if (hit){ if (cur && cur.team === hit[1]) cur.s.push(s); else { cur = {team:hit[1], ref:hit[2], s:[s]}; groups.push(cur); } gap = 0; }
      else if (cur && gap < 2 && act){ cur.s.push(s); gap++; }
      else gap++;
    });
  });
  const base = fbMeeting(), auto = [], rest = [];
  groups.forEach(g => {
    const tx = g.s.join(' '), act = AC.test(tx) || CK.test(tx) || TL.test(tx), kind = CK.test(tx) ? '확인 요청' : TL.test(tx) ? '전달' : '지시';
    (act ? auto : rest).push({team:g.team, ref:g.ref, text:tx, kind:act ? kind : '전달', due:dueOf(tx, base), mode:!act || kind === '전달' ? '' : KP.test(tx) ? 'keep' : 'once'});
  });
  return {n, auto, rest};
}
function autoFb(src){

  const a = S.active, res = scanTr(S.ui.tr); a.notes = a.notes || []; let added = 0, dup = 0;

}

    if (R.role === 'input'){ const me = myTeam();
      if (!me || !S.teams.some(t => t.name === me)) setMyTeam(el.value);
      else if (el.value !== me && !confirm(el.value + ' 팀 안건을 고치게 됩니다. 내 팀(' + me + ')이 아닙니다. 계속할까요?')){ el.value = S.roleTeam; return; } }
    S.roleTeam = el.value; S.ui.err = ''; }
  else if (d.ch === 'inTeam'){ S.inTeam = el.value; S.ui.err = ''; }
  else if (d.ch === 'fbTeam'){ S.ui.fbTeam = el.value; }
  else if (d.ch === 'hteam'){ S.ui.hteam = el.value; }
  else if (d.ch === 'tday' || d.ch === 'ttime'){
    const i = +d.i, old = S.set.times, nx = Object.assign({}, stAt(i));
    if (d.ch === 'tday') nx.o = +el.value; else if (/^\d\d:\d\d$/.test(el.value)) nx.h = el.value;
    S.set.times = Object.assign({}, DEF_T, old || {}, {[i]:nx});
    if ([2,3].every(k => stKey(k) >= stKey(k-1)) && stKey(1) > stKey(0)){ log('일정 시각 변경: ' + stName(i)); S.md = {}; toast(stName(i) + '(으)로 바꿨습니다'); tick(); }
    else { S.set.times = old; toast('순서가 맞지 않아 바꾸지 않았습니다. 기입 마감, 점검 마감, 최종 공지 순서여야 합니다.'); }
  }
  else if (d.ch === 'noteTeam'){ const n = (S.active.notes || []).find(x => x.id === d.id); if (n) n.team = el.value; }
  else if (d.ch === 'mset'){ S.set[d.k] = el.checked; if (S.md) delete S.md.report; }
  else if (d.ch === 'head'){ S.teams[+d.i].head = el.value; S.teams[+d.i].guess = false; }
  else if (d.ch === 'inc'){ ((S.edits[d.w] = S.edits[d.w] || {})[d.id] = S.edits[d.w][d.id] || {}).inc = el.checked; }
  else if (d.ch === 'none'){ (S.active.none[d.t] = S.active.none[d.t] || {})[d.c] = el.checked; }
  else if (d.in === 'sub' || d.in === 'type'){ const it = S.active.items.find(i => i.id === d.id); if (it){ it[d.in] = el.value; touch(it, el); } save(); return; }
  else return;
  render();
});
function touch(it, el){ if (!it.carried) return; it.carried = false; const box = el.closest('.draft'), c = box && box.querySelector('.carried'); if (c) c.remove(); }
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset; if (!d.in) return;
  if (d.in === 'memo'){ ((S.edits[d.w] = S.edits[d.w] || {})[d.id] = S.edits[d.w][d.id] || {}).memo = el.value; }
  else if (d.in === 'fbAct'){ S.active.fbAct[d.id] = el.value; }
  else if (d.in === 'tr'){ S.ui.tr = el.value; }
  else if (d.in === 'q'){ S.ui.q = el.value; return; }
  else if (d.in === 'set'){ S.set[d.k] = el.value; if (d.k === 'rs' || d.k === 'rb'){ const pv = document.getElementById('tplPv'); if (pv) pv.innerHTML = tplPv(); if (S.md){ delete S.md.all; delete S.md.remind; } } }
  else if (d.in === 'mail'){ S.md = S.md || {}; if (!S.md[d.t] || !S.md[d.t].dirty || S.md[d.t].week !== S.active.label) { const f = mailDraft(d.t, S.active.label); S.md[d.t] = Object.assign({}, f, {dirty:true, base:{body:f.body, to:f.to}}); } S.md[d.t][d.k] = el.value; }
  else if (d.in === 'tmail'){ S.teams[+d.i].mail = el.value.trim(); }
  else if (d.in === 'subs'){ S.cats[+d.i].subs = el.value.split(',').map(s => s.trim()).filter(Boolean); }
  else if (d.in === 'note'){ const n = (S.active.notes || []).find(x => x.id === d.id); if (n) n.text = el.value; }
  else if (d.in === 'org'){ S.set.org[+d.i][d.k] = el.value.trim(); S.md = {}; }
  else if (['title','now','cause','plan','detail'].includes(d.in)){ const it = S.active.items.find(i => i.id === d.id); if (it){ it[d.in] = el.value; if (d.in === 'detail'){ it.now = ''; it.cause = ''; it.plan = ''; } touch(it, el); const c = el.parentElement.querySelector('.cnt2'); if (c){ c.textContent = el.value.length + '/80'; c.classList.toggle('over', el.value.length > 80); } } }
  save();
});
document.addEventListener('paste', e => { if (e.target && e.target.id === 'tr') setTimeout(() => { S.ui.tr = e.target.value; S.ui.trName = '붙여넣은 내용'; const n = autoFb('붙여넣은 내용'); render(); toast(n > 0 ? '붙여넣은 내용에서 요약 ' + n + '건을 올렸습니다' : '새로 올릴 문장을 찾지 못했습니다'); }, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'q'){ render(); } if (e.key === 'Escape' && S.ui.paper){ S.ui.paper = false; render(); } });
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.tg; if (k){ S.ui[k] = e.target.open; save(); } }, true);
const msgBox = m => '<main class="wrap"><div class="sheet"><p style="padding:48px 16px;text-align:center">' + esc(m) + '</p></div></main>';
if (R.on){
  document.getElementById('app').innerHTML = msgBox('구글 시트에서 불러오는 중입니다…');
  srvBoot().then(() => { tick(); render(); srvState('saved'); setInterval(srvPoll, 60000); })
    .catch(e => { R.err = e.message; srvState('boot'); document.getElementById('app').innerHTML = msgBox('불러오지 못했습니다: ' + e.message); });
} else {
  S = load(); if (!S) boot();
  S.ui.pend = null;
  tick();
  render();
}
/* 실제 시계: 시점이 넘어가도 글을 쓰는 중이면 화면을 바꾸지 않는다 */
function beat(){
  if (!S || (R.on && !R.ready)) return;
  const was = phOf(S.active.stage); if (!tick()) return;
  const el = document.activeElement, typing = el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== 'checkbox';
  if (typing){ save(); toast(stName(S.active.stage) + ' 시점이 되었습니다. 입력을 마치면 화면이 바뀝니다.'); S.ui.pend = was; }
  else { follow(was); render(); }
}
document.addEventListener('focusout', () => { if (S && S.ui.pend != null) setTimeout(() => { const el = document.activeElement; if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return; const was = S.ui.pend; S.ui.pend = null; follow(was); render(); }, 150); });
setInterval(beat, 60000);
</script>
